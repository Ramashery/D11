<main id="main" class="page page--post">
  <article>
  <header class="page__head">
    <h1 class="page__title">{{ .Title }}</h1>
    {{ with .Description }}<p class="page__lead">{{ . }}</p>{{ end }}
  </header>
    {{- /* TODO(дизайн): страница статьи (insights/<slug>) */}}
    {{ with .Date }}<p class="page__lead"><time datetime="{{ .Format "2006-01-02" }}">{{ .Format "2006-01-02" }}</time></p>{{ end }}
    <div class="page__content">{{ .Content }}</div>
  </article>
</main>
{{ partial "_footer.html" . }}
