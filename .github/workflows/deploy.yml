name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: "0 3 * * *" }]      # ночная пересборка: подтягивает свежий контент из Firestore
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - uses: peaceiris/actions-hugo@v3
        with: { hugo-version: "latest", extended: true }   # лучше закрепить версию, на которой собираете локально
      - id: pages
        uses: actions/configure-pages@v5
      - name: Firestore → data/en/*.json   (без FIREBASE_PROJECT_ID шаг ничего не делает)
        working-directory: tools/firestore-sync
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
        run: go run . -out ../../data/en
      - name: Hugo
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" -d _site
      - name: URL без слэша на конце
        run: bash scripts/postbuild.sh _site "${{ steps.pages.outputs.base_path }}" "en ka ru" en
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
