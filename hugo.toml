baseURL = "https://YOUR-USER.github.io/YOUR-REPO/"   # со своим доменом: "https://romaha.dev/"
title = "Romaha Dev Agency"
timeout = "60s"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

# ---- структура URL: /en, /en/works, /en/works/case — без слэша на конце
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
uglyURLs = true              # файлы dir.html; ссылки печатаются без ".html" (partials/_url.html, _rurl.html)

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content/en"
    title = "Romaha Dev Agency"
  [languages.ka]
    languageName = "ქართული"
    weight = 2
    contentDir = "content/ka"
    title = "Romaha Dev Agency"
  [languages.ru]
    languageName = "Русский"
    weight = 3
    contentDir = "content/ru"
    title = "Romaha Dev Agency"

[minify]
  minifyOutput = true

[params.firebase]
  # публичные значения — безопасно держать в репозитории; доступ ограничивают firestore.rules
  projectId = "YOUR_FIREBASE_PROJECT_ID"
  apiKey    = "YOUR_WEB_API_KEY"

# ---- какой шаблон (layouts/_default/tpl_*.html) рисует какую страницу ----
# Один раз здесь — в .md-файлах поле layout писать не нужно (но можно: front matter важнее).
[[cascade]]
  layout = "tpl_home"
  [cascade._target]
    kind = "home"
[[cascade]]
  layout = "tpl_works"
  [cascade._target]
    path = "/works"
    kind = "section"
[[cascade]]
  layout = "tpl_case"
  [cascade._target]
    path = "/works/**"
    kind = "page"
[[cascade]]
  layout = "tpl_services"
  [cascade._target]
    path = "/services"
    kind = "section"
[[cascade]]
  layout = "tpl_offer"
  [cascade._target]
    path = "/services/**"
    kind = "page"
[[cascade]]
  layout = "tpl_insights"
  [cascade._target]
    path = "/insights"
    kind = "section"
[[cascade]]
  layout = "tpl_post"
  [cascade._target]
    path = "/insights/**"
    kind = "page"
[[cascade]]
  layout = "tpl_about"
  [cascade._target]
    path = "/about"
